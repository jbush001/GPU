name: CI Hardware Pipeline

on:
  push:
    branches: [ main ]
    paths-ignore:
          - 'docs/**'
          - '**/*.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
          - 'docs/**'
          - '**/*.md'

jobs:
  test:
    name: Run Simulation Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (GraalVM / OpenJDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Scala CLI
        uses: VirtusLab/scala-cli-setup@v1

      # Cache Scala CLI & Coursier dependencies to eliminate repeated bloop downloads
      - name: Cache Scala CLI & Coursier
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/scala-cli
          key: ${{ runner.os }}-scala-cli-${{ hashFiles('**/*.scala', '**/*.sc') }}
          restore-keys: |
            ${{ runner.os }}-scala-cli-

      # Using the prebuilt setup-verilator action avoids a slow 15-minute local engine compile step
      - name: Install Verilator Backend
        uses: veryl-lang/setup-verilator@v1

      - name: Run Tests
        run: |
          scala-cli test hardware
          python3 -m unittest discover tools
          scala-cli run hardware --test
